id: bixolon-srp-e300
display_name: BIXOLON SRP-E300
category: escpos
status: unverified
driver: drv:///escpos.drv/gp80160.ppd
paper_width_mm: 80
printable_width_mm: 72
# The SRP-E300 has a 72 mm, 180 dpi print area on 79.5 mm roll paper.
# Constraining the raster width prevents the GP-80160II compatibility
# driver from sending an approximately 80 mm image that is clipped at right.
page_size: Custom.72x297mm
resolution: 180dpi
color_model: Gray
monochrome: true
cutter: true
supported_connections: [socket, usb]
cups_options:
  print-color-mode: monochrome
  escCutter: "1"
