[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airprint-server"
version = "0.4.0"
description = "A lightweight AirPrint server for USB and network printers, with built-in profiles for ESC/POS thermal receipt printers."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "airprint-server contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=7.2", "pytest-cov>=4", "ruff>=0.4", "types-PyYAML>=6"]

[project.scripts]
airprint-server = "airprint_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
airprint_server = ["data/profiles/*.yaml", "data/*.txt", "py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["airprint_server"]
